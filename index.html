<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UX Bootcamp · Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <script>
    (function () {
      var saved = localStorage.getItem("uxbootcamp-theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
</head>
<body>

  <header class="app-header">
    <div class="app-header__brand">
      <i class="fa-solid fa-compass-drafting"></i>
      <span>UX Bootcamp</span>
    </div>

    <nav class="tab-banner" aria-label="Navegación de vistas">
      <button class="tab-chip is-active"
              data-view="curriculum"
              data-src="views/curriculum.html"
              aria-selected="true"
              role="tab">
        <i class="fa-solid fa-layer-group"></i>
        <span>Estructura curricular</span>
      </button>

      <button class="tab-chip"
              data-view="ecosystem"
              data-src="views/ecosystem.html"
              role="tab"
              aria-selected="false">
        <i class="fa-solid fa-diagram-project"></i>
        <span>Ecosistema organizacional</span>
      </button>

      <button class="tab-chip"
              data-view="roles"
              data-src="views/roles.html"
              role="tab"
              aria-selected="false"
              disabled>
        <i class="fa-solid fa-circle-nodes"></i>
        <span>Roles complementarios</span>
      </button>

      <span class="tab-banner__indicator" aria-hidden="true"></span>
    </nav>

    <div class="app-header__actions">
      <div class="theme-switch">
        <button class="theme-switch__btn" id="theme-quick-toggle" type="button" aria-label="Cambiar a tema claro">
          <i class="fa-solid fa-sun"></i>
        </button>
        <button
          class="theme-switch__btn"
          id="theme-settings-btn"
          type="button"
          aria-label="Elegir tema"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <i class="fa-solid fa-palette"></i>
        </button>

        <div class="theme-panel" id="theme-panel" role="menu" hidden>
          <button class="theme-option" type="button" role="menuitem" data-theme="dark">
            <span class="theme-option__swatch theme-option__swatch--dark"></span>Oscuro
          </button>
          <button class="theme-option" type="button" role="menuitem" data-theme="light">
            <span class="theme-option__swatch theme-option__swatch--light"></span>Claro
          </button>
          <button class="theme-option" type="button" role="menuitem" data-theme="contrast">
            <span class="theme-option__swatch theme-option__swatch--contrast"></span>Alto contraste
          </button>
          <button class="theme-option" type="button" role="menuitem" data-theme="ocean">
            <span class="theme-option__swatch theme-option__swatch--ocean"></span>Océano
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="view-root" class="view-root">
    <div id="view-outlet" class="view-outlet"></div>
  </main>

  <script src="assets/js/dashboard.js"></script>
</body>
</html>

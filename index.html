<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UX Bootcamp · Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header__brand">
      <i class="fa-solid fa-compass-drafting"></i>
      <span>UX Bootcamp</span>
    </div>

    <nav class="tab-banner" aria-label="Navegación de vistas">
      <button class="tab-chip is-active"
              data-view="curriculum"
              data-src="views/curriculum.html"
              aria-selected="true"
              role="tab">
        <i class="fa-solid fa-layer-group"></i>
        <span>Estructura curricular</span>
      </button>

      <button class="tab-chip"
              data-view="ecosystem"
              data-src="views/ecosystem.html"
              role="tab"
              aria-selected="false"
              disabled>
        <i class="fa-solid fa-diagram-project"></i>
        <span>Ecosistema organizacional</span>
      </button>

      <button class="tab-chip"
              data-view="roles"
              data-src="views/roles.html"
              role="tab"
              aria-selected="false"
              disabled>
        <i class="fa-solid fa-circle-nodes"></i>
        <span>Roles complementarios</span>
      </button>

      <span class="tab-banner__indicator" aria-hidden="true"></span>
    </nav>
  </header>

  <main id="view-root" class="view-root">
    <div id="view-outlet" class="view-outlet"></div>
  </main>

  <script src="assets/js/dashboard.js"></script>
</body>
</html>
